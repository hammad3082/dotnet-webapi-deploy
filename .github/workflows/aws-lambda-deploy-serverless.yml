name: Deploy Weather API to AWS Lambda

on:
  push:
    branches:
      - main  # Adjust this if your branch is named 'master' or 'release'
  workflow_dispatch: # Allows you to run the deployment manually from GitHub

jobs:
  deploy-to-lambda:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install the .NET 8 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3. Install the AWS Lambda CLI tool and fix the PATH
      - name: Install AWS Lambda Tools
        run: |
          dotnet tool install -g Amazon.Lambda.Tools
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # 4. Connect to AWS using your secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Build, Zip, Upload, and Deploy everything
      - name: Deploy Serverless Stack
        run: |
          dotnet lambda deploy-serverless \
            --s3-bucket ${{ secrets.EB_S3_BUCKET }} \